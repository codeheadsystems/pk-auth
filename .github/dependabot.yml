# Dependabot configuration for pk-auth.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# A single root `gradle` entry covers the whole multi-project build, including build-logic and
# example apps. The `npm` entries cover the published browser SDK and each demo's Playwright
# e2e suite — these run in CI and on developer machines, so they are part of the supply chain.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # Micronaut 5.x requires JVM 25; the project targets Java 21 (brief §3). Stay on the 4.x
      # line until the JDK baseline moves.
      - dependency-name: "io.micronaut:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.micronaut.test:*"
        update-types: ["version-update:semver-major"]
      # logback 1.6.0 removed ch.qos.logback.classic.PatternLayout.DEFAULT_CONVERTER_MAP, which
      # Dropwizard 5's dropwizard-request-logging reads in a static initializer — every Dropwizard
      # app then dies at boot with NoSuchFieldError (see PR #138). Dropwizard 5.0.2 is the newest
      # release and still resolves logback 1.5.x, so stay on the 1.5 line — patch updates still
      # flow. Drop this once Dropwizard ships logback 1.6 support. Note the minor entry: 1.5 -> 1.6
      # is a semver-minor bump, so ignoring majors alone would not hold the line.
      - dependency-name: "ch.qos.logback:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "npm"
    directories:
      - "/clients/passkeys-browser"
      - "/examples/spring-boot-demo/e2e"
      - "/examples/dropwizard-demo/e2e"
      - "/examples/micronaut-demo/e2e"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      gh-actions:
        applies-to: version-updates
        patterns:
          - "*"
